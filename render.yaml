services:
  - type: web
    name: leader-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
